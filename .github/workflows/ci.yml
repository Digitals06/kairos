name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy + tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/kovaaks-tauri/ui/package-lock.json

      # The tauri crate's build expects the frontend dist to exist; building it
      # here also gates frontend compile errors on every push.
      - name: Build frontend
        working-directory: crates/kovaaks-tauri/ui
        run: |
          npm ci
          npm run build

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The suite is offline by design: live/network tests are #[ignore]-gated
      # and skip themselves when their prerequisites are absent.
      - name: Tests
        run: cargo test --workspace
