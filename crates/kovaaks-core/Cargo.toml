[package]
name = "kovaaks-core"
description = "Domain, storage, HTTP and CSV ingest for the KovaaK's companion app (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true

# Full planned dependency set declared up front so the shared
# [workspace.dependencies] table is validated by a real build from Task 0.1 on.
# tokio/anyhow are exercised by Tasks 1.3+ (HTTP client, sync engine).
[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
