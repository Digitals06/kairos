[package]
name = "kovaaks-tauri"
description = "Kairos — KovaaK's Companion desktop app (Tauri v2 shell + commands bridge)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kovaaks_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kairos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Embeds the built frontend (ui/dist) into the binary via tauri::generate_context!.
# Production builds MUST enable this (tauri build does it automatically; plain
# `cargo build` does not — see build.rs/tauri.conf devUrl for the dev-server path).
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
kovaaks-core = { workspace = true }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
